name: Plugin bundles and releases
# The VST3 and CLAP bundles of AudioRef for Linux (x86_64), Windows (x86_64) and macOS (one
# universal bundle for Intel and Apple silicon), each built, tested and checked on its system: the
# CLAP bundle with clap-validator, the VST3 bundle with pluginval. For each commit on main, they
# replace the files of the pre-release "snapshot", whose tag moves to that commit. A version tag,
# e.g. v0.1.0, publishes them as the release of that version, with the version's section of
# CHANGELOG.md as notes, see Changelog and versions in docs/DEVELOPMENT.md. Pull requests only
# build and check them, so a change that breaks them shows before it is merged.
#
# The user manual, docs/manual, is rendered as PDF in English and German once, on Linux, and goes
# into every archive and, as files of their own, into the releases, see User manual in
# docs/DEVELOPMENT.md.
#
# The Windows installer, audioref-windows-x86_64-setup.exe, is compiled with Inno Setup from the
# files of the Windows archive, installed and removed once each way, and goes into the releases too,
# see Windows installer in docs/DEVELOPMENT.md.
#
# The pre-release "snapshot" changes, so release immutability must stay off (Settings, General,
# Releases). An immutable release takes no new files, its tag doesn't move, and GitHub never lets
# its tag name be used again, not even after the release and the tag are deleted.
on:
  push:
    branches: ["main"]
    # Versions, e.g. v0.1.0 or v1.0.0-rc.1.
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request cancels the run for the previous one. On main, a run finishes
  # before the next one starts, so publishing isn't interrupted halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  # Pinned, as Dependabot doesn't update it: a new release is used only once someone looked at
  # it. Bump deliberately.
  CLAP_VALIDATOR_TAG: "0.4.1"
  # pluginval's release binaries, pinned by their checksums in the matrix below. Bump deliberately,
  # with the new checksums.
  PLUGINVAL_VERSION: "v1.0.4"
jobs:
  manual:
    name: User manual (PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pandoc and LuaLaTeX
        run: utils/install-linux-deps.sh --manual
      - name: Render the manual
        run: make manual
      - name: Upload the manual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audioref-manual
          path: target/manual/audioref-manual-*.pdf
          if-no-files-found: error
          # Re-running the job replaces the manual of the previous attempt.
          overwrite: true

  build:
    name: Bundle and check (${{ matrix.name }})
    # For the manual in the archives.
    needs: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            bundle: bundle
            targets: ""
            pluginval: Linux
            pluginval-sha256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
            pluginval-exe: pluginval/pluginval
          - name: windows-x86_64
            runner: windows-2025
            bundle: bundle
            targets: ""
            pluginval: Windows
            pluginval-sha256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
            pluginval-exe: pluginval/pluginval.exe
          # One bundle with the code for Intel and for Apple silicon.
          - name: macos-universal
            runner: macos-15
            bundle: bundle-universal
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            pluginval: macOS
            pluginval-sha256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
            pluginval-exe: pluginval/pluginval.app/Contents/MacOS/pluginval
    env:
      BUNDLE: ${{ matrix.bundle }}
      ARCHIVE: audioref-${{ matrix.name }}
      PLUGINVAL_OS: ${{ matrix.pluginval }}
      PLUGINVAL_SHA256: ${{ matrix.pluginval-sha256 }}
      PLUGINVAL_EXE: ${{ matrix.pluginval-exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Install the libraries of the window
        if: runner.os == 'Linux'
        run: utils/install-linux-deps.sh
      - name: Run tests
        # On each system, as the plugin crate reads the system's locale.
        run: cargo test --workspace --locked
      - name: Bundle the plugin
        run: cargo run --locked --package xtask --release -- "$BUNDLE" audioref --release --locked
      - name: Sign the bundles ad hoc (macOS)
        # Apple silicon only loads signed code. An ad-hoc signature isn't notarized: Gatekeeper
        # still asks, see Installing in the README.
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - target/bundled/AudioRef.vst3
          codesign --force --deep --sign - target/bundled/AudioRef.clap
      - name: Install clap-validator
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_TAG" clap-validator
      - name: Check the CLAP bundle (clap-validator)
        run: clap-validator validate target/bundled/AudioRef.clap
      - name: Install pluginval
        # Only the archive with the checksum pinned above.
        run: |
          curl --fail --silent --show-error --location --output pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_$PLUGINVAL_OS.zip"
          # Compares the hash itself: the check modes of GNU's sha256sum, macOS 15's BSD sha256sum
          # and shasum take different arguments.
          if command -v sha256sum > /dev/null; then
            hash=$(sha256sum pluginval.zip)
          else
            hash=$(shasum -a 256 pluginval.zip)
          fi
          hash=${hash%% *}
          if [ "$hash" != "$PLUGINVAL_SHA256" ]; then
            echo "::error::pluginval_$PLUGINVAL_OS.zip has the SHA-256 $hash, not $PLUGINVAL_SHA256"
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -opluginval pluginval.zip > /dev/null
          else
            unzip -q pluginval.zip -d pluginval
          fi
      - name: Check the VST3 bundle (pluginval)
        # The strictest level, without the tests that open the plugin's window, as the runners
        # have no display and the plugin has no window yet.
        run: |
          "$PLUGINVAL_EXE" --strictness-level 10 --skip-gui-tests --validate-in-process \
            --validate target/bundled/AudioRef.vst3
      - name: Download the manual
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioref-manual
          path: manual
      - name: Pack the bundles
        run: |
          rm -rf pluginval pluginval.zip
          mkdir -p "$ARCHIVE"
          cp -R target/bundled/AudioRef.vst3 target/bundled/AudioRef.clap README.md CHANGELOG.md LICENSE "$ARCHIVE/"
          # The user manual, in English and German.
          cp manual/audioref-manual-en.pdf manual/audioref-manual-de.pdf "$ARCHIVE/"
          # The source, the authors and the license of the built-in presets, as CC BY-SA 4.0 asks.
          cp data/opra/README.md "$ARCHIVE/OPRA-PRESETS.md"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$ARCHIVE.zip" "$ARCHIVE" > /dev/null
          else
            zip -r -q -y "$ARCHIVE.zip" "$ARCHIVE"
          fi
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.zip
          if-no-files-found: error
          # Re-running the job replaces the archive of the previous attempt.
          overwrite: true

  installer:
    name: Windows installer
    # From the Windows archive, so the installer holds the same files.
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SETUP: audioref-windows-x86_64-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the Windows archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioref-windows-x86_64
          path: dist
      - name: Unpack the archive
        run: 7z x -odist dist/audioref-windows-x86_64.zip > /dev/null
      - name: Compile the installer (Inno Setup)
        # PowerShell, as Git's bash would turn the options, e.g. /DVersion=, into paths.
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          # Inno Setup 6 comes with the runner's image.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DVersion=$version" "/DBundles=$PWD\dist\audioref-windows-x86_64" "/O$PWD\setup" "/F$env:SETUP" installer\audioref.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Install and remove it
        # Express installation, again over it as an update, removal, then custom installation of
        # the CLAP plugin alone, and removal: each time, the files must be where DAWs look for them,
        # the same as in the archive, or gone.
        shell: pwsh
        run: |
          $setup = "setup\$env:SETUP.exe"
          $bundles = 'dist\audioref-windows-x86_64'
          $app = "$env:ProgramFiles\AudioRef"
          $files = [ordered]@{
            vst3 = "$env:CommonProgramFiles\VST3\AudioRef.vst3\Contents\x86_64-win\AudioRef.vst3"
            clap = "$env:CommonProgramFiles\CLAP\AudioRef.clap"
            'manual-en' = "$app\audioref-manual-en.pdf"
            'manual-de' = "$app\audioref-manual-de.pdf"
          }
          $sources = @{
            vst3 = "$bundles\AudioRef.vst3\Contents\x86_64-win\AudioRef.vst3"
            clap = "$bundles\AudioRef.clap"
            'manual-en' = "$bundles\audioref-manual-en.pdf"
            'manual-de' = "$bundles\audioref-manual-de.pdf"
          }
          function Run([string] $exe, [string[]] $arguments) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$exe $arguments failed with exit code $($process.ExitCode)" }
          }
          function Expect([string[]] $installed) {
            foreach ($name in $files.Keys) {
              $path = $files[$name]
              if ($installed -contains $name) {
                if (-not (Test-Path -LiteralPath $path)) { throw "$path is missing" }
                if ((Get-FileHash -LiteralPath $path).Hash -ne (Get-FileHash -LiteralPath $sources[$name]).Hash) {
                  throw "$path isn't the file of the archive"
                }
              } elseif (Test-Path -LiteralPath $path) {
                throw "$path is there, but shouldn't be"
              }
            }
            Write-Output "Installed as expected: $($installed -join ', ')"
          }
          function Uninstall {
            Run "$app\unins000.exe" @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            # The uninstaller runs as a copy of itself, which deletes the original at the end.
            for ($i = 0; ($i -lt 60) -and (Test-Path -LiteralPath "$app\unins000.exe"); $i++) { Start-Sleep -Seconds 1 }
          }
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')

          Run $setup ($silent + @('/TYPE=express', '/LOG=install-express.log'))
          Expect @('vst3', 'clap', 'manual-en', 'manual-de')
          if (-not (Test-Path -LiteralPath "$app\OPRA-PRESETS.md")) { throw 'OPRA-PRESETS.md is missing' }
          if (-not (Test-Path -LiteralPath "$app\LICENSE.txt")) { throw 'LICENSE.txt is missing' }
          Run $setup ($silent + @('/TYPE=express', '/LOG=install-update.log'))
          Expect @('vst3', 'clap', 'manual-en', 'manual-de')
          Uninstall
          Expect @()

          Run $setup ($silent + @('/COMPONENTS=clap', '/LOG=install-custom.log'))
          Expect @('clap')
          Uninstall
          Expect @()
      - name: Show the logs of the installer
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Filter 'install-*.log' | ForEach-Object { Write-Output "::group::$($_.Name)"; Get-Content $_; Write-Output '::endgroup::' }
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SETUP }}
          path: setup/${{ env.SETUP }}.exe
          if-no-files-found: error
          # Re-running the job replaces the installer of the previous attempt.
          overwrite: true

  publish:
    name: Publish ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || 'pre-release "snapshot"' }}
    needs: [build, installer]
    # Commits on main and version tags only, not pull requests or other branches started by hand.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # move the tag, update the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The version's own tag, or snapshot, which moves.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
    steps:
      # For the version, its changes and the date of the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version tag
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG doesn't match the version in Cargo.toml, $version. Tag the commit that sets the version with v$version."
            exit 1
          fi
          # Only what was merged into main becomes a release.
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::The tag $TAG is on a commit that isn't on main."
            exit 1
          fi
          # The version's section of the changelog, for the release notes.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $version. Rename the section [Unreleased] to [$version] with the date."
            exit 1
          fi
      - name: Download archives and the manual
        # The archives, audioref-<system>.zip, the Windows installer, audioref-windows-x86_64-setup.exe,
        # and the manual, audioref-manual-en.pdf and -de.pdf.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: audioref-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum audioref-*.zip audioref-*-setup.exe audioref-manual-*.pdf | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/audioref-*.zip
            dist/audioref-*-setup.exe
            dist/audioref-manual-*.pdf
      - name: Describe the downloads
        # For the notes of both kinds of releases.
        run: |
          cat > downloads.md <<EOF
          | System | File |
          |---|---|
          | Windows 10 or newer, x86_64: installer | \`audioref-windows-x86_64-setup.exe\` |
          | Windows 10 or newer, x86_64 | \`audioref-windows-x86_64.zip\` |
          | macOS, Intel and Apple silicon | \`audioref-macos-universal.zip\` |
          | Linux, x86_64 | \`audioref-linux-x86_64.zip\` |

          On Windows, the installer puts the VST3 and the CLAP plugin where DAWs look for them, with the user manual; its custom installation installs only the ones you choose. It isn't signed, so Windows may warn before it runs: click **More info**, then **Run anyway**.

          Each archive holds \`AudioRef.vst3\` and \`AudioRef.clap\`, with the user manual in English and German, the README, the changelog, the license, and the source and license of the built-in presets (\`OPRA-PRESETS.md\`). See [Installing]($GITHUB_SERVER_URL/$GH_REPO#installing) in the README for where they go.

          | User manual | File |
          |---|---|
          | English | \`audioref-manual-en.pdf\` |
          | Deutsch | \`audioref-manual-de.pdf\` |

          **AudioRef is for private, non-commercial use only**, see the [disclaimer]($GITHUB_SERVER_URL/$GH_REPO#disclaimer).

          To check a download, compare its checksum, and verify with the [GitHub CLI](https://cli.github.com) that this repository's workflow built it:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify audioref-windows-x86_64.zip --repo $GH_REPO
          \`\`\`
          EOF
      - name: Publish the pre-release
        if: github.ref_type == 'branch'
        run: |
          # A re-run of an older run must not replace the bundles of a newer commit.
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Not published: main is at $head now, its run publishes it."
            exit 0
          fi

          # An immutable release takes no new files and its tag doesn't move, see above.
          if [ "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled 2>/dev/null)" = true ]; then
            echo "::error::Release immutability is on (Settings, General, Releases). The pre-release $TAG takes the files of each new commit, so turn it off."
            exit 1
          fi
          if [ "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable 2>/dev/null)" = true ]; then
            echo "::error::The pre-release $TAG is immutable and can't change any more. Delete it and its tag, and give the pre-release a new tag name in this workflow: GitHub doesn't let the tag name of an immutable release be used again."
            exit 1
          fi

          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          date=$(git log -1 --format=%cs)
          short=${GITHUB_SHA::7}
          url="$GITHUB_SERVER_URL/$GH_REPO"
          title="Latest build of main ($short, $date)"
          cat > notes.md <<EOF
          The plugin bundles of the latest commit on \`main\`, [$short]($url/commit/$GITHUB_SHA) of $date: version $version and the [changes since then]($url/blob/$GITHUB_SHA/CHANGELOG.md#unreleased).
          Each new commit on \`main\` replaces them.

          EOF
          cat downloads.md >> notes.md

          # Move the tag to this commit, or create it.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          # Replace the release's files and notes, or create it.
          if gh release view "$TAG" --json name >/dev/null 2>&1; then
            # Delete files that this build doesn't have, e.g. after an archive was renamed.
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --prerelease --verify-tag --title "$title" --notes-file notes.md
          fi
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          version=${TAG#v}
          url="$GITHUB_SERVER_URL/$GH_REPO"
          {
            echo "## Changes"
            echo
            # Links relative to the changelog lead to the files of this version.
            perl -pe "s{\]\((?!https?://|#)([^)]+)\)}{]($url/blob/$TAG/\$1)}g" changes.md
            echo
            echo "## Downloads"
            echo
            cat downloads.md
          } > notes.md

          # A version with a suffix, e.g. -rc.1, is a pre-release.
          prerelease=()
          if [[ $version == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # The files of a published version don't change. A draft is left of an earlier attempt
          # that failed, which this one completes.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already. To publish it again, delete the release first, not its tag."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${prerelease[@]}" --title "AudioRef $version" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft "${prerelease[@]}" --verify-tag \
              --title "AudioRef $version" --notes-file notes.md
          fi
          # Published only once it has all files.
          gh release edit "$TAG" --draft=false
