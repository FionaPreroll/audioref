# The crates of AudioRef, see docs/ARCHITECTURE.md:
# - crates/audioref-core: the plugin's logic, its signal processing and its texts, without plugin
#   APIs, GUI or I/O
# - crates/audioref: the plugin, which connects that logic to the hosts through nih-plug
# - xtask: bundles the plugin as VST3 and CLAP
[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
# The version of AudioRef, which make version sets, see Changelog and versions in
# docs/DEVELOPMENT.md.
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/FionaPreroll/audioref"
# A plugin, released as bundles on GitHub, not libraries for crates.io.
publish = false

[workspace.dependencies]
audioref-core = { path = "crates/audioref-core" }
# nih-plug isn't on crates.io: pinned to a commit, see Dependencies in docs/PLAN.md. Keep both
# revisions the same.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rtrb = "0.4.1"
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage), on nightly also cfg(coverage_nightly). cargo fuzz sets
# cfg(fuzzing), which makes the entry points for fuzzing public.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
# Strict from the start, which costs less than tightening later: the pedantic lints, and nothing
# that panics, as a panic in a plugin takes the host down with it. Tests may unwrap, expect and
# panic, see clippy.toml. CI turns all warnings into errors.
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
# A plugin runs inside the host: unwinding out of it is undefined, so stop at once.
panic = "abort"
