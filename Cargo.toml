# The crates of AudioRef, see docs/ARCHITECTURE.md:
# - crates/audioref-core: the plugin's logic, its signal processing and its texts, without plugin
#   APIs, GUI or I/O
# - crates/audioref: the plugin, which connects that logic to the hosts through nih-plug
# - xtask: bundles the plugin as VST3 and CLAP
[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
# The version of AudioRef, which make version sets, see Changelog and versions in
# docs/DEVELOPMENT.md.
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/FionaPreroll/audioref"
# A plugin, released as bundles on GitHub, not libraries for crates.io.
publish = false

[workspace.dependencies]
audioref-core = { path = "crates/audioref-core" }
# nih-plug isn't on crates.io: AudioRef's fork of it, pinned to a commit of its branch `audioref`,
# see Dependencies in docs/PLAN.md. Keep the three revisions the same.
nih_plug = { git = "https://github.com/FionaPreroll/nih-plug.git", rev = "76d2bd21c6e29aa9709109f382b2bc5810e25ce9", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/FionaPreroll/nih-plug.git", rev = "76d2bd21c6e29aa9709109f382b2bc5810e25ce9" }
nih_plug_xtask = { git = "https://github.com/FionaPreroll/nih-plug.git", rev = "76d2bd21c6e29aa9709109f382b2bc5810e25ce9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rtrb = "0.4.1"
# FFTs for the design of the FIR filters and the convolution, see crates/audioref-core/src/fir.rs.
realfft = "3.5.1"
# Deflate, pure Rust: packs OPRA's database into the plugin, see crates/audioref-core/src/bundled.rs.
miniz_oxide = "0.9.1"
sys-locale = "0.3.2"
# The native dialog that picks a file, see crates/audioref/src/browse.rs. On Linux through the
# XDG desktop portal, or zenity without one, so the plugin links no GTK.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# Grand Central Dispatch, to run the file dialog on macOS after the frame that opens it.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage), on nightly also cfg(coverage_nightly). cargo fuzz sets
# cfg(fuzzing), which makes the entry points for fuzzing public.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
# Strict from the start, which costs less than tightening later: the pedantic lints, and nothing
# that panics, as a panic in a plugin takes the host down with it. Tests may unwrap, expect and
# panic, see clippy.toml. CI turns all warnings into errors.
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
# A plugin runs inside the host: unwinding out of it is undefined, so stop at once.
panic = "abort"
