[package]
name = "audioref"
description = "AudioRef, headphone correction for monitoring: the VST3 and CLAP plugin."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for the plugin bundles, lib for the tests.
crate-type = ["cdylib", "lib"]

[dependencies]
audioref-core.workspace = true
nih_plug.workspace = true
nih_plug_egui.workspace = true
rtrb.workspace = true
sys-locale.workspace = true
rfd.workspace = true

# Queues the file dialog on the main thread, outside the frame, see src/browse.rs.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true

[build-dependencies]
# The list of crates and their licenses for the about window, see build.rs.
audioref-core.workspace = true

[lints]
workspace = true
