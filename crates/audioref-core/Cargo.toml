[package]
name = "audioref-core"
description = "AudioRef, headphone correction for monitoring: its logic, signal processing and texts, without plugin APIs, GUI or I/O."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only crates without plugin APIs, GUI or I/O: no nih-plug, no egui, no files. make lint checks it.
[dependencies]
# OPRA's database, see src/opra.rs.
serde.workspace = true
serde_json.workspace = true
# The FFTs of the FIR filters, see src/fir.rs.
realfft.workspace = true
# Packs the built-in database, see src/bundled.rs.
miniz_oxide.workspace = true

[lints]
workspace = true
